[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-oriented Enterprise RAG Platform for grounded, secure, and evaluable knowledge retrieval."
readme = "README.md"
requires-python = ">=3.11"
authors = [
{ name = "Enterprise RAG Platform Team" }
]

dependencies = [
"fastapi>=0.115,<1.0",
"uvicorn[standard]>=0.30,<1.0",
"pydantic>=2.9,<3.0",
"pydantic-settings>=2.5,<3.0",
"python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.3,<9.0",
"pytest-asyncio>=0.24,<1.0",
"httpx>=0.27,<1.0",
"ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
"tests",
]
pythonpath = [
".",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"B",
"UP",
]

[tool.setuptools.packages.find]
include = [
"app*",
]
